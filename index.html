<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Fee UPI Collector</title>
    <!-- Load qrcode.js library for client-side rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 15px; background: #4F46E5; color: white; border: none; cursor: pointer; width: 100%;}
        #qr-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .qr-card { border: 1px solid #ccc; padding: 15px; text-align: center; border-radius: 8px;}
    </style>
</head>
<body>

    <h2>Collect the full amount. Pay ₹0 fees.</h2>
    
    <div class="input-group">
        <label>Your UPI ID</label>
        <input type="text" id="upiId" placeholder="example@bank.com">
    </div>
    <div class="input-group">
        <label>Account holder name</label>
        <input type="text" id="payeeName" placeholder="Jane Doe">
    </div>
    <div class="input-group">
        <label>Full amount to collect (₹)</label>
        <input type="number" id="totalAmount" placeholder="4500">
    </div>

    <button onclick="generateSplitQRs()">Generate QR codes &rarr;</button>

    <div id="qr-container"></div>

    <script src="script.js"></script>
</body>
</html>
